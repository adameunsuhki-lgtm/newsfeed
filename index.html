<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>은서의 종합 뷰어</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --bg0: #eef2ff;
      --bg1: #fce7f3;
      --fg: #18181b;
      --card: rgba(255, 255, 255, 0.88);
      --border: rgba(24, 24, 27, 0.08);
      --muted: #71717a;
      --accent: #18181b;
      --shadow: 0 8px 24px rgba(24, 24, 27, 0.08), 0 1px 2px rgba(24, 24, 27, 0.04);
      --shadow-hover: 0 12px 28px rgba(24, 24, 27, 0.12), 0 2px 4px rgba(24, 24, 27, 0.06);
      --danger: #ef4444;
      --input-bg: #ffffff;
      --ring: #6366f1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg0: #0f172a;
        --bg1: #1e1b4b;
        --fg: #fafafa;
        --card: rgba(39, 39, 42, 0.88);
        --border: rgba(250, 250, 250, 0.1);
        --muted: #a1a1aa;
        --accent: #fafafa;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.25);
        --shadow-hover: 0 12px 28px rgba(0, 0, 0, 0.45), 0 2px 4px rgba(0, 0, 0, 0.3);
        --input-bg: #27272a;
        --ring: #818cf8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--fg);
      background: linear-gradient(160deg, var(--bg0), var(--bg1) 55%, var(--bg0));
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 1.25rem 1rem 2rem;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      width: min(26rem, 100%);
      text-align: center;
      margin-top: 1.25rem;
    }
    .header {
      margin-bottom: 1.35rem;
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.4rem;
    }
    .date {
      display: inline-block;
      margin: 0 0 0.55rem;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 550;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    h1, p, a, button, label, input { word-break: keep-all; overflow-wrap: anywhere; }
    .links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.28rem;
      min-height: 7.25rem;
      padding: 1rem 0.75rem 0.95rem;
      border-radius: 1.1rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.15s ease;
      cursor: pointer;
      font: inherit;
      appearance: none;
      -webkit-appearance: none;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
    .card:active {
      transform: scale(0.97);
      opacity: 0.92;
    }
    .card .icon {
      font-size: 1.7rem;
      line-height: 1;
      margin-bottom: 0.15rem;
    }
    .card .title {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .card .desc {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.3;
      max-width: 11rem;
    }
    .card-add {
      border-style: dashed;
      background: color-mix(in srgb, var(--card) 70%, transparent);
      color: var(--muted);
    }
    .card-add .icon {
      font-size: 1.85rem;
      font-weight: 300;
      color: var(--ring);
    }
    .card-add .title { color: var(--muted); font-weight: 650; }
    .card-custom .title {
      padding-inline: 0.85rem;
    }
    .del {
      position: absolute;
      top: 0.35rem;
      right: 0.35rem;
      width: 1.55rem;
      height: 1.55rem;
      border: none;
      border-radius: 999px;
      background: color-mix(in srgb, var(--danger) 12%, transparent);
      color: var(--danger);
      font-size: 0.85rem;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      padding: 0;
      font: inherit;
    }
    .del:hover, .del:active {
      background: color-mix(in srgb, var(--danger) 22%, transparent);
    }
    .form-panel {
      display: none;
      grid-column: 1 / -1;
      text-align: left;
      padding: 1rem;
      border-radius: 1.1rem;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .form-panel.open { display: block; }
    .form-panel h2 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 0.7rem;
    }
    .field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }
    .field input {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border-radius: 0.7rem;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--fg);
      font: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .field input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 28%, transparent);
    }
    .form-actions {
      display: flex;
      gap: 0.55rem;
      margin-top: 0.35rem;
    }
    .form-actions button {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      font: inherit;
      font-weight: 650;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .form-actions button:active { transform: scale(0.97); }
    .btn-cancel {
      background: transparent;
      color: var(--muted);
    }
    .btn-add {
      background: var(--accent);
      color: var(--bg0);
      border-color: transparent;
    }
    @media (prefers-color-scheme: dark) {
      .btn-add { color: #0f172a; background: #fafafa; }
    }
    @media (min-width: 420px) {
      main { margin-top: 2rem; }
      .card { min-height: 7.75rem; }
    }
  </style>
</head>
<body>
  <main>
    <header class="header">
      <h1>은서의 종합 뷰어</h1>
      <div class="date" id="today-date"></div>
      <p class="subtitle">원하는 뷰어를 선택하세요</p>
    </header>
    <div class="links" id="links">
      <a class="card" href="https://home-viewer.adameunsuhki.workers.dev/" rel="noopener">
        <span class="icon" aria-hidden="true">🏠</span>
        <span class="title">홈 뷰어 🔒</span>
        <span class="desc">비밀번호로 보호된 홈</span>
      </a>
      <a class="card" href="news.html">
        <span class="icon" aria-hidden="true">📰</span>
        <span class="title">뉴스 뷰어</span>
        <span class="desc">최신 뉴스 모아보기</span>
      </a>
      <a class="card" href="ai.html">
        <span class="icon" aria-hidden="true">🤖</span>
        <span class="title">AI 뉴스 뷰어</span>
        <span class="desc">AI·테크 소식</span>
      </a>
      <button type="button" class="card card-add" id="add-btn" aria-label="웹사이트 추가">
        <span class="icon" aria-hidden="true">+</span>
        <span class="title">추가</span>
        <span class="desc">내 웹사이트 넣기</span>
      </button>
      <form class="form-panel" id="add-form" autocomplete="off">
        <h2>웹사이트 추가</h2>
        <div class="field">
          <label for="link-name">이름</label>
          <input id="link-name" name="name" type="text" maxlength="40" required placeholder="예: 블로그">
        </div>
        <div class="field">
          <label for="link-url">주소</label>
          <input id="link-url" name="url" type="text" maxlength="500" required placeholder="example.com" inputmode="url">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="cancel-btn">취소</button>
          <button type="submit" class="btn-add">추가</button>
        </div>
      </form>
    </div>
  </main>
  <script>
(function () {
  var STORAGE_KEY = 'hub_custom_links';
  var dateEl = document.getElementById('today-date');
  var addBtn = document.getElementById('add-btn');
  var form = document.getElementById('add-form');
  var nameInput = document.getElementById('link-name');
  var urlInput = document.getElementById('link-url');
  var cancelBtn = document.getElementById('cancel-btn');

  function formatToday() {
    try {
      return new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'America/Los_Angeles',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'short'
      }).format(new Date());
    } catch (e) {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
  }
  dateEl.textContent = formatToday();

  function loadLinks() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveLinks(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function normalizeUrl(url) {
    var u = String(url || '').trim();
    if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }

  function isSafeHttpUrl(url) {
    try {
      var u = new URL(url);
      return u.protocol === 'http:' || u.protocol === 'https:';
    } catch (e) {
      return false;
    }
  }

  function render() {
    var list = loadLinks();
    var parent = addBtn.parentNode;
    var existing = parent.querySelectorAll('.card-custom');
    for (var i = 0; i < existing.length; i++) existing[i].parentNode.removeChild(existing[i]);
    var frag = document.createDocumentFragment();
    list.forEach(function (item, index) {
      var a = document.createElement('a');
      a.className = 'card card-custom';
      a.href = item.url;
      a.rel = 'noopener';

      var icon = document.createElement('span');
      icon.className = 'icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.textContent = '🔗';

      var title = document.createElement('span');
      title.className = 'title';
      title.textContent = item.name;

      var desc = document.createElement('span');
      desc.className = 'desc';
      try {
        desc.textContent = new URL(item.url).hostname;
      } catch (e) {
        desc.textContent = '내 링크';
      }

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.setAttribute('aria-label', '삭제');
      del.textContent = '✕';
      del.addEventListener('click', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        if (!confirm('삭제할까요?')) return;
        var next = loadLinks();
        next.splice(index, 1);
        saveLinks(next);
        render();
      });

      a.appendChild(icon);
      a.appendChild(title);
      a.appendChild(desc);
      a.appendChild(del);
      frag.appendChild(a);
    });
    parent.insertBefore(frag, addBtn);
  }

  function openForm() {
    form.classList.add('open');
    nameInput.value = '';
    urlInput.value = '';
    nameInput.focus();
  }

  function closeForm() {
    form.classList.remove('open');
  }

  addBtn.addEventListener('click', openForm);
  cancelBtn.addEventListener('click', closeForm);

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var name = String(nameInput.value || '').trim();
    var url = normalizeUrl(urlInput.value);
    if (!name || !url || !isSafeHttpUrl(url)) {
      urlInput.focus();
      return;
    }
    var list = loadLinks();
    list.push({ name: name, url: url });
    saveLinks(list);
    closeForm();
    render();
  });

  render();
})();
  </script>
</body>
</html>
