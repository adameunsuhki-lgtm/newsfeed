, 포괄적 'AI 노동자 보호법' 제정", "summary": "개빈 뉴섬 캘리포니아 주지사가 9월 30일 직장 내 AI 남용을 금지하는 법안들에 서명했다고 가디언을 인용해 뉴시안이 보도했다. 새 법에 따라 기업은 해고 결정을 AI에만 전적으로 의존할 수 없고, AI로 직원 감정을 예측하거나 뇌파 등 신경 데이터를 수집하는 행위가 금지되며, AI 도입에 따른 대규모 해고는 노동자에게 의무적으로 알려야 한다. 콜로라도·일리노이·텍사스 등에도 유사한 법이 있지만 이처럼 포괄적인 곳은 없다는 평가다. 다만 노동자 개인이 직접 소송할 수 없고 주 정부만 집행할 수 있어 실효성에 한계가 있다는 지적도 나왔다.", "original_title": "[월드 프리즘] \"AI가 해고 결정 못한다\"…미 캘리포니아, 세계 첫 'AI 노동자 보호법' 제정 |", "lang": "ko", "translated": true, "source": "뉴시안", "query": "AI 규제 법안", "link": "http://www.newsian.co.kr/news/articleView.html?idxno=96494", "google_link": "https://news.google.com/rss/articles/CBMibkFVX3lxTE51S0NKWEpLaHJLTHZWSHh4Qm0ya3hJWXRNckJ4U2F6N1J6NFBJTDJUVl9LWENhaUd6Q1pWakN1bUJKQllqa0JOeHNuT24yYjhUa0lmODJGQkw3d2dxMVRVbzRDRVpGcnhLMktXMXhR?oc=5", "summary_basis": "full", "images": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAFgAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD0VaeV+XNOVeac/CmggyL5flOa5rUBnNdLqB4Nc3fDrUsCjH1qYDioY1Oc1YHSpGMIqFxg1YIqGQc0xkRGRVacdatEVXn70CMm671mSD5jWrdd6zJVBbjiuasdFIao5qdAKiUcgVOgrjZ0kyD8KsRAA8c1BGDxVmIcj0pAOm+6ev41z+qjhq6OUfLXPaqvynGK0p7mcjhdZ7muYl+8a6nWRya5aX7xr0qb0OWQwU4UwU4VoSOFOFNoFADqdTRS4pgLRRRQAU2nU00AFKKbSg0APBqRKiFPU0AWENTKaqq1TK1DAsZ4pwNQhqcDUMpEpPFNZuKaW96Rg3l <script>
(async function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let data;
  try {
    const r = await fetch("feed.json?t=" + Date.now(), { cache: "no-store" });
    data = await r.json();
  } catch (e) { $("#updated").textContent = "피드를 불러오지 못했습니다."; return; }
  $("#updated").textContent = "마지막 업데이트: " + data.updated_pt;
  const arts = (data.articles || (data.topics || []).flatMap((t) => t.articles)).slice();
  for (let i = arts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arts[i], arts[j]] = [arts[j], arts[i]]; }
  const ago = (iso) => {
    const m = (Date.now() - new Date(iso).getTime()) / 60000;
    if (!isFinite(m)) return "";
    if (m < 60) return Math.max(1, Math.round(m)) + "분 전";
    if (m < 1440) return Math.round(m / 60) + "시간 전";
    return Math.round(m / 1440) + "일 전";
  };
  const pics = (a) => {
    const im = (a.images || []).filter(Boolean);
    if (!im.length) return "";
    return `<div class="pics n${Math.min(im.length, 2)}">${im.slice(0, 2).map((src) =>
      `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`).join("")}<\/div>`;
  };
  const card = (a) => `<article class="card">
      <div class="head"><a class="title" href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}<\/a>
        <span class="ago" title="${esc(a.published_pt)}">${ago(a.published)}<\/span><\/div>
      ${a.translated && a.lang === "en" ? `<div class="orig">${esc(a.original_title)}<\/div>` : ""}
      <p>${esc(a.summary)}<\/p>
      ${pics(a)}
      <div class="meta"><a href="${esc(a.link)}" target="_blank" rel="noopener" class="src">${esc(a.source)} ↗<\/a><span>${esc(a.published_pt)}${a.translated ? "" : " · 번역 대기"}<\/span><\/div>
    <\/article>`;
  $("#feed").innerHTML = arts.length ? arts.map(card).join("") : '<div class="empty">새 기사가 없습니다.<\/div>';
})();

</script>
