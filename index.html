<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (function () {
    try {
      var k = 'hub_theme';
      var t = localStorage.getItem(k);
      if (t !== 'light' && t !== 'dark') {
        t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
  </script>
  <title>종합뷰어</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
  <style>
    :root, [data-theme="light"] {
      color-scheme: light;
      --bg0: #eef2ff;
      --bg1: #fce7f3;
      --fg: #18181b;
      --card: rgba(255, 255, 255, 0.88);
      --border: rgba(24, 24, 27, 0.08);
      --muted: #71717a;
      --accent: #18181b;
      --shadow: 0 8px 24px rgba(24, 24, 27, 0.08), 0 1px 2px rgba(24, 24, 27, 0.04);
      --shadow-hover: 0 12px 28px rgba(24, 24, 27, 0.12), 0 2px 4px rgba(24, 24, 27, 0.06);
      --danger: #ef4444;
      --input-bg: #ffffff;
      --ring: #6366f1;
      --toggle-bg: rgba(255, 255, 255, 0.9);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg0: #0f172a;
      --bg1: #1e1b4b;
      --fg: #fafafa;
      --card: rgba(39, 39, 42, 0.88);
      --border: rgba(250, 250, 250, 0.1);
      --muted: #a1a1aa;
      --accent: #fafafa;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.25);
      --shadow-hover: 0 12px 28px rgba(0, 0, 0, 0.45), 0 2px 4px rgba(0, 0, 0, 0.3);
      --input-bg: #27272a;
      --ring: #818cf8;
      --toggle-bg: rgba(39, 39, 42, 0.92);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        color-scheme: dark;
        --bg0: #0f172a;
        --bg1: #1e1b4b;
        --fg: #fafafa;
        --card: rgba(39, 39, 42, 0.88);
        --border: rgba(250, 250, 250, 0.1);
        --muted: #a1a1aa;
        --accent: #fafafa;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.35), 0 1px 2px rgba(0, 0, 0, 0.25);
        --shadow-hover: 0 12px 28px rgba(0, 0, 0, 0.45), 0 2px 4px rgba(0, 0, 0, 0.3);
        --input-bg: #27272a;
        --ring: #818cf8;
        --toggle-bg: rgba(39, 39, 42, 0.92);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--fg);
      background: linear-gradient(160deg, var(--bg0), var(--bg1) 55%, var(--bg0));
      display: flex;
      align-items: stretch;
      justify-content: center;
      height: 100dvh;
      padding: 1rem;
      -webkit-tap-highlight-color: transparent;
    }
    main {
      width: 100%;
      text-align: center;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .header {
      margin-bottom: 1rem;
      flex: 0 0 auto;
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.4rem;
    }
    .date {
      display: inline-block;
      margin: 0 0 0.55rem;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 550;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    h1, p, a, button, label, input { word-break: keep-all; overflow-wrap: anywhere; }
    .links {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      grid-auto-rows: auto;
      align-content: start;
      gap: 0.75rem;
    }
    .card.dragging {
      opacity: 0.45;
      cursor: grabbing;
    }
    .card {
      cursor: grab;
      -webkit-user-select: none;
      user-select: none;
    }
    .card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.28rem;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 1rem 0.75rem 0.95rem;
      border-radius: 1.1rem;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--accent);
      text-decoration: none;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.15s ease;
      cursor: pointer;
      font: inherit;
      appearance: none;
      -webkit-appearance: none;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }
    .card:active {
      transform: scale(0.97);
      opacity: 0.92;
    }
    .card .icon {
      font-size: 1.7rem;
      line-height: 1;
      margin-bottom: 0.15rem;
      display: grid;
      place-items: center;
      width: 2.5rem;
      height: 2.5rem;
    }
    .card .icon img {
      width: 40px;
      height: 40px;
      border-radius: 0.55rem;
      object-fit: contain;
      background: transparent;
    }
    .card .title {
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card .desc {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.3;
      max-width: 11rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-add {
      border-style: dashed;
      background: color-mix(in srgb, var(--card) 70%, transparent);
      color: var(--muted);
    }
    .card-add .icon {
      font-size: 1.85rem;
      font-weight: 300;
      color: var(--ring);
    }
    .card-add .title { color: var(--muted); font-weight: 650; }
    .card-custom .title {
      padding-inline: 0.85rem;
    }
    .del {
      position: absolute;
      top: 0.35rem;
      right: 0.35rem;
      width: 1.55rem;
      height: 1.55rem;
      border: none;
      border-radius: 999px;
      background: color-mix(in srgb, var(--danger) 12%, transparent);
      color: var(--danger);
      font-size: 0.85rem;
      line-height: 1;
      cursor: pointer;
      display: none;
      place-items: center;
      padding: 0;
      font: inherit;
    }
    .del:hover, .del:active {
      background: color-mix(in srgb, var(--danger) 22%, transparent);
    }
    .links.editing .del { display: grid; }
    .links.editing .card {
      outline: 1.5px dashed color-mix(in srgb, var(--ring) 55%, transparent);
      outline-offset: -7px;
    }
    .card-addlink {
      display: none;
      border-style: dashed;
      background: color-mix(in srgb, var(--card) 70%, transparent);
      color: var(--muted);
    }
    .links.editing .card-addlink { display: flex; }
    .card-addlink .icon {
      font-size: 1.85rem;
      font-weight: 300;
      color: var(--ring);
    }
    .card-addlink .title { color: var(--muted); font-weight: 650; }
    .form-panel {
      display: none;
      grid-column: 1 / -1;
      text-align: left;
      padding: 1rem;
      border-radius: 1.1rem;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .form-panel.open { display: block; }
    .form-panel h2 {
      margin: 0 0 0.75rem;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 0.7rem;
    }
    .field label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }
    .field input {
      width: 100%;
      padding: 0.7rem 0.8rem;
      border-radius: 0.7rem;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--fg);
      font: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .field input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 28%, transparent);
    }
    .form-actions {
      display: flex;
      gap: 0.55rem;
      margin-top: 0.35rem;
    }
    .form-actions button {
      flex: 1;
      padding: 0.7rem 0.9rem;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      font: inherit;
      font-weight: 650;
      font-size: 0.92rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .form-actions button:active { transform: scale(0.97); }
    .btn-cancel {
      background: transparent;
      color: var(--muted);
    }
    .btn-add {
      background: var(--accent);
      color: var(--bg0);
      border-color: transparent;
    }
    [data-theme="dark"] .btn-add { color: #0f172a; background: #fafafa; }
    .theme-toggle {
      position: fixed;
      top: 0.85rem;
      right: 0.85rem;
      z-index: 20;
      width: 2.6rem;
      height: 2.6rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--toggle-bg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
      font-size: 1.15rem;
      line-height: 1;
      display: grid;
      place-items: center;
      padding: 0;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .theme-toggle:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
    .theme-toggle:active { transform: scale(0.95); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.25rem;
      transform: translateX(-50%) translateY(120%);
      z-index: 40;
      max-width: min(22rem, calc(100vw - 2rem));
      padding: 0.65rem 0.95rem;
      border-radius: 0.85rem;
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-hover);
      font-size: 0.85rem;
      font-weight: 550;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.22s ease, opacity 0.22s ease;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="테마 전환">🌙</button>
  <div class="toast" id="sync-toast" role="status" aria-live="polite"></div>
  <main>
    <header class="header">
      <h1>종합뷰어</h1>
      <div class="date" id="today-date"></div>
    </header>
    <div class="links" id="links">
      <button type="button" class="card card-add" id="add-btn" aria-label="편집">
        <span class="icon" aria-hidden="true">✎</span>
        <span class="title">편집</span>
        <span class="desc">추가·삭제·순서 변경</span>
      </button>
      <button type="button" class="card card-addlink" id="add-link-btn" aria-label="웹사이트 추가">
        <span class="icon" aria-hidden="true">+</span>
        <span class="title">추가</span>
        <span class="desc">내 웹사이트 넣기</span>
      </button>
      <form class="form-panel" id="add-form" autocomplete="off">
        <h2>웹사이트 추가</h2>
        <div class="field">
          <label for="link-name">이름</label>
          <input id="link-name" name="name" type="text" maxlength="40" required placeholder="예: 블로그">
        </div>
        <div class="field">
          <label for="link-url">주소</label>
          <input id="link-url" name="url" type="text" maxlength="500" required placeholder="example.com" inputmode="url">
        </div>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="cancel-btn">취소</button>
          <button type="submit" class="btn-add">추가</button>
        </div>
      </form>
    </div>
  </main>
  <script>
(function () {
  var STORAGE_KEY = 'hub_custom_links';
  var ORDER_KEY = 'hub_card_order';
  var SYNC_URL = 'https://hub-links.adameunsuhki.workers.dev/links';
  var WRITE_KEY = '1c1493667485e3966fd96268a8f244dd';
  var dateEl = document.getElementById('today-date');
  var addBtn = document.getElementById('add-btn');
  var form = document.getElementById('add-form');
  var nameInput = document.getElementById('link-name');
  var urlInput = document.getElementById('link-url');
  var cancelBtn = document.getElementById('cancel-btn');
  var toastEl = document.getElementById('sync-toast');
  var toastTimer = null;

  function formatToday() {
    try {
      return new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'America/Los_Angeles',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'short'
      }).format(new Date());
    } catch (e) {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
  }
  dateEl.textContent = formatToday();

  function showToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = String(msg || '');
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 3200);
  }

  function loadLinks() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveLinks(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch (e) {}
  }

  function normalizeUrl(url) {
    var u = String(url || '').trim();
    if (!u) return '';
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    return u;
  }

  function isSafeHttpUrl(url) {
    try {
      var u = new URL(url);
      return u.protocol === 'http:' || u.protocol === 'https:';
    } catch (e) {
      return false;
    }
  }

  function dedupeByUrl(list) {
    var seen = {};
    var out = [];
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      if (!item || typeof item.name !== 'string' || typeof item.url !== 'string') continue;
      var name = String(item.name).trim();
      var url = String(item.url).trim();
      if (!name || !url || !isSafeHttpUrl(url)) continue;
      if (seen[url]) continue;
      seen[url] = true;
      out.push({ name: name.slice(0, 60), url: url.slice(0, 500) });
      if (out.length >= 50) break;
    }
    return out;
  }

  function pickFallbackEmoji(hostname, name) {
    var s = String(hostname || '') + ' ' + String(name || '');
    s = s.toLowerCase();
    var rules = [
      [/youtube/, '▶️'],
      [/netflix/, '🎬'],
      [/music|spotify|음악/, '🎵'],
      [/mail|gmail|메일/, '✉️'],
      [/bank|navyfederal|은행/, '🏦'],
      [/shop|amazon|coupang|쇼핑/, '🛒'],
      [/news|뉴스/, '📰'],
      [/weather|날씨/, '🌤️'],
      [/map|지도/, '🗺️'],
      [/calendar|캘린더/, '📅'],
      [/github|code/, '💻'],
      [/army|\.mil\b|군/, '🪖'],
      [/ai|chatgpt|grok|claude/, '🤖'],
      [/game|게임/, '🎮'],
      [/sports|nfl|espn|스포츠/, '🏈'],
      [/finance|stock|주식/, '📈'],
      [/translate|번역/, '🌐'],
      [/book|책/, '📚'],
      [/video/, '🎥']
    ];
    for (var i = 0; i < rules.length; i++) {
      if (rules[i][0].test(s)) return rules[i][1];
    }
    return '🔗';
  }

  function render(list) {
    if (!list) list = loadLinks();
    var parent = addBtn.parentNode;
    var existing = parent.querySelectorAll('.card-custom');
    for (var i = 0; i < existing.length; i++) existing[i].parentNode.removeChild(existing[i]);
    var frag = document.createDocumentFragment();
    list.forEach(function (item, index) {
      var host = '';
      try { host = new URL(item.url).hostname || ''; } catch (e) { host = ''; }
      var hostLabel = host.replace(/^www\./i, '') || '내 링크';
      var fallbackEmoji = pickFallbackEmoji(host, item.name);

      var a = document.createElement('a');
      a.className = 'card card-custom';
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.draggable = true;
      a.dataset.key = item.url;

      var icon = document.createElement('span');
      icon.className = 'icon';
      icon.setAttribute('aria-hidden', 'true');

      if (host) {
        var img = document.createElement('img');
        img.alt = '';
        img.width = 40;
        img.height = 40;
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.draggable = false;
        img.src = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(host) + '&sz=128';
        img.addEventListener('error', function () {
          while (icon.firstChild) icon.removeChild(icon.firstChild);
          icon.textContent = fallbackEmoji;
        });
        icon.appendChild(img);
      } else {
        icon.textContent = fallbackEmoji;
      }

      var title = document.createElement('span');
      title.className = 'title';
      title.textContent = item.name;

      var desc = document.createElement('span');
      desc.className = 'desc';
      desc.textContent = hostLabel;

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.setAttribute('aria-label', '삭제');
      del.textContent = '✕';
      del.addEventListener('click', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        if (!confirm('삭제할까요?')) return;
        var next = loadLinks().slice();
        var removed = false;
        for (var j = 0; j < next.length; j++) {
          if (next[j].url === item.url && next[j].name === item.name) {
            next.splice(j, 1);
            removed = true;
            break;
          }
        }
        if (!removed) next.splice(index, 1);
        saveLinks(next);
        render(next);
        pushLinks(next);
      });

      a.appendChild(icon);
      a.appendChild(title);
      a.appendChild(desc);
      a.appendChild(del);
      frag.appendChild(a);
    });
    parent.insertBefore(frag, addBtn);
    applyOrder();
  }

  function fetchLinks() {
    return fetch(SYNC_URL, {
      method: 'GET',
      cache: 'no-store',
      credentials: 'omit'
    }).then(function (res) {
      if (!res.ok) throw new Error('get ' + res.status);
      return res.json();
    }).then(function (data) {
      if (!Array.isArray(data)) throw new Error('bad payload');
      return dedupeByUrl(data);
    });
  }

  function pushLinks(list) {
    var clean = dedupeByUrl(list || []);
    return fetch(SYNC_URL, {
      method: 'PUT',
      cache: 'no-store',
      credentials: 'omit',
      headers: {
        'Content-Type': 'application/json',
        'X-Hub-Write-Key': WRITE_KEY
      },
      body: JSON.stringify(clean)
    }).then(function (res) {
      if (!res.ok) throw new Error('put ' + res.status);
      return res.json();
    }).then(function (data) {
      var server = dedupeByUrl(Array.isArray(data) ? data : clean);
      saveLinks(server);
      return server;
    }).catch(function (err) {
      showToast('동기화 실패 · 이 기기에만 저장됨');
      throw err;
    });
  }

  function syncFromServer() {
    return fetchLinks().then(function (server) {
      var local = loadLinks();
      if (server.length === 0 && local.length > 0) {
        var merged = dedupeByUrl(local.concat(server));
        return pushLinks(merged).then(function (uploaded) {
          render(uploaded);
          return uploaded;
        });
      }
      saveLinks(server);
      render(server);
      return server;
    }).catch(function () {
      showToast('동기화 실패 · 로컬 목록 표시');
    });
  }

  function openForm() {
    form.classList.add('open');
    nameInput.value = '';
    urlInput.value = '';
    nameInput.focus();
  }

  function closeForm() {
    form.classList.remove('open');
  }

  var addLinkBtn = document.getElementById('add-link-btn');
  var editing = false;
  function setEditing(on) {
    editing = on;
    linksEl.classList.toggle('editing', on);
    addBtn.querySelector('.icon').textContent = on ? '✓' : '✎';
    addBtn.querySelector('.title').textContent = on ? '완료' : '편집';
    addBtn.querySelector('.desc').textContent = on ? '편집 끝내기' : '추가·삭제·순서 변경';
    addBtn.setAttribute('aria-label', on ? '편집 완료' : '편집');
    if (!on) closeForm();
  }
  addBtn.addEventListener('click', function () { setEditing(!editing); });
  addLinkBtn.addEventListener('click', openForm);
  cancelBtn.addEventListener('click', closeForm);

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var name = String(nameInput.value || '').trim();
    var url = normalizeUrl(urlInput.value);
    if (!name || !url || !isSafeHttpUrl(url)) {
      urlInput.focus();
      return;
    }
    if (name.length > 60) name = name.slice(0, 60);
    if (url.length > 500) url = url.slice(0, 500);
    var list = dedupeByUrl(loadLinks().concat([{ name: name, url: url }]));
    saveLinks(list);
    closeForm();
    render(list);
    pushLinks(list);
  });

  var linksEl = document.getElementById('links');

  function loadOrder() {
    try {
      var raw = localStorage.getItem(ORDER_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveOrderFromDom() {
    var keys = [];
    var cards = linksEl.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      if (cards[i].dataset && cards[i].dataset.key) keys.push(cards[i].dataset.key);
    }
    try { localStorage.setItem(ORDER_KEY, JSON.stringify(keys)); } catch (e) {}
  }

  function applyOrder() {
    var order = loadOrder();
    if (!order.length) return;
    var cards = Array.prototype.slice.call(linksEl.querySelectorAll('.card'));
    if (!cards.length) return;
    function rank(el) {
      var idx = order.indexOf(el.dataset ? el.dataset.key : null);
      return idx === -1 ? order.length : idx;
    }
    cards.sort(function (x, y) { return rank(x) - rank(y); });
    for (var i = 0; i < cards.length; i++) linksEl.appendChild(cards[i]);
    linksEl.appendChild(form);
  }

  addBtn.draggable = true;
  addBtn.dataset.key = 'add';

  var dragEl = null;
  var dragMoved = false;
  var suppressClick = false;

  linksEl.addEventListener('dragstart', function (ev) {
    var card = ev.target && ev.target.closest ? ev.target.closest('.card') : null;
    if (!card) return;
    if (ev.target.closest && ev.target.closest('.del')) {
      ev.preventDefault();
      return;
    }
    dragEl = card;
    dragMoved = false;
    card.classList.add('dragging');
    try {
      ev.dataTransfer.effectAllowed = 'move';
      ev.dataTransfer.setData('text/plain', card.dataset.key || '');
    } catch (e) {}
  });

  linksEl.addEventListener('dragover', function (ev) {
    if (!dragEl) return;
    ev.preventDefault();
    try { ev.dataTransfer.dropEffect = 'move'; } catch (e) {}
    var target = ev.target && ev.target.closest ? ev.target.closest('.card') : null;
    if (!target || target === dragEl || target.parentNode !== linksEl) return;
    var rect = target.getBoundingClientRect();
    var midY = rect.top + rect.height / 2;
    var after;
    if (ev.clientY >= rect.top && ev.clientY <= rect.bottom) {
      after = ev.clientX > rect.left + rect.width / 2;
    } else {
      after = ev.clientY > midY;
    }
    if (after) {
      if (target.nextElementSibling !== dragEl) {
        linksEl.insertBefore(dragEl, target.nextElementSibling);
        dragMoved = true;
      }
    } else {
      if (target.previousElementSibling !== dragEl) {
        linksEl.insertBefore(dragEl, target);
        dragMoved = true;
      }
    }
  });

  document.addEventListener('dragend', function () {
    if (!dragEl) return;
    dragEl.classList.remove('dragging');
    linksEl.appendChild(form);
    saveOrderFromDom();
    dragEl = null;
    if (dragMoved) {
      suppressClick = true;
      setTimeout(function () { suppressClick = false; }, 80);
    }
    dragMoved = false;
  });

  linksEl.addEventListener('click', function (ev) {
    if (suppressClick) {
      ev.preventDefault();
      ev.stopPropagation();
      suppressClick = false;
      return;
    }
    if (editing && ev.target && ev.target.closest && ev.target.closest('a.card-custom')) {
      ev.preventDefault();
      ev.stopPropagation();
    }
  }, true);

  var THEME_KEY = 'hub_theme';
  var themeBtn = document.getElementById('theme-toggle');

  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'light' || t === 'dark') return t;
    try {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    } catch (e) {
      return 'light';
    }
  }

  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
    themeBtn.setAttribute('aria-label', t === 'dark' ? '라이트 모드' : '다크 모드');
  }

  applyTheme(currentTheme());
  themeBtn.addEventListener('click', function () {
    applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
  });

  render(loadLinks());
  syncFromServer();
})();
  </script>
</body>
</html>
