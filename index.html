<script>
(async function () {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let data;
  try {
    const r = await fetch("feed.json?t=" + Date.now(), { cache: "no-store" });
    data = await r.json();
  } catch (e) { $("#updated").textContent = "피드를 불러오지 못했습니다."; return; }
  $("#updated").textContent = "마지막 업데이트: " + data.updated_pt;
  const arts = (data.articles || (data.topics || []).flatMap((t) => t.articles)).slice();
  for (let i = arts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arts[i], arts[j]] = [arts[j], arts[i]]; }
  const ago = (iso) => {
    const m = (Date.now() - new Date(iso).getTime()) / 60000;
    if (!isFinite(m)) return "";
    if (m < 60) return Math.max(1, Math.round(m)) + "분 전";
    if (m < 1440) return Math.round(m / 60) + "시간 전";
    return Math.round(m / 1440) + "일 전";
  };
  const pics = (a) => {
    const im = (a.images || []).filter(Boolean);
    if (!im.length) return "";
    return `<div class="pics n${Math.min(im.length, 2)}">${im.slice(0, 2).map((src) =>
      `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`).join("")}<\/div>`;
  };
  const card = (a) => `<article class="card">
      <div class="head"><a class="title" href="${esc(a.link)}" target="_blank" rel="noopener">${esc(a.title)}<\/a>
        <span class="ago" title="${esc(a.published_pt)}">${ago(a.published)}<\/span><\/div>
      ${a.translated && a.lang === "en" ? `<div class="orig">${esc(a.original_title)}<\/div>` : ""}
      <p>${esc(a.summary)}<\/p>
      ${pics(a)}
      <div class="meta"><a href="${esc(a.link)}" target="_blank" rel="noopener" class="src">${esc(a.source)} ↗<\/a><span>${esc(a.published_pt)}${a.translated ? "" : " · 번역 대기"}<\/span><\/div>
    <\/article>`;
  $("#feed").innerHTML = arts.length ? arts.map(card).join("") : '<div class="empty">새 기사가 없습니다.<\/div>';
})();

</script>
